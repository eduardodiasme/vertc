<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Vertc</title>
    <meta name="description" content="Get in touch with Vertc for specialized IT Infrastructure and Strategic Cloud Consulting services.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EV%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h1>Vertc</h1>
            </a>
            <p class="tagline">INFRASTRUCTURE & SYSTEMS CONSULTING</p>
        </div>
        <a href="index.html" class="contact-btn">Back</a>
    </header>

    <main>
        <div class="content-wrapper contact-wrapper">
            <div class="left-section contact-left">
                <h2 class="coming-text">
                    <span class="coming">Get In</span>
                    <span class="soon-wrapper">
                        <span class="soon-glass" id="soonGlass">
                            <span class="soon-text">Touch.</span>
                        </span>
                    </span>
                </h2>
            </div>

            <div class="right-section contact-form-section">
                <p class="description">We're here to help.</p>
                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>VERTC.XYZ</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
